[package]
name = "poseidon_hash_mina"
version = "0.1.0"
edition = "2024"
author = "youtpout and claude" 

[dependencies]
crypto-bigint = { version = "0.5", default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# SP1 patch: U256::mul_mod → syscall_uint256_mulmod in zkVM
[patch.crates-io]
crypto-bigint = { git = "https://github.com/sp1-patches/RustCrypto-bigint", tag = "patch-0.5.5-sp1-6.0.0" }

[[bench]]
name = "benchmark"
harness = false